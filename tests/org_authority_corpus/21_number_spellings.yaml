# nable org model v1
# YAML 1.1 reads 1e5 as text (a float needs a dot and a signed exponent), so that
# bound is refused; 1.5e+4 is a number.
- fact: authority
  subject: {kind: action_class, id: rds_ri}
  value: {rung: recommend, max_commitment_usd_per_plan: 1e5}
  source: human
  status: confirmed
  confirmed_at: 2026-10-01
- fact: authority
  subject: {kind: action_class, id: elasticache_ri}
  value: {rung: recommend, max_commitment_usd_per_plan: 1.5e+4}
  source: human
  status: confirmed
  confirmed_at: 2026-10-01
- fact: authority
  subject: {kind: action_class, id: database_savings_plan}
  value: {rung: on}
  source: human
  status: confirmed
  confirmed_at: 2026-10-01
