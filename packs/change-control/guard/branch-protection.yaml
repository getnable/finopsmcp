# Always on. Branch protection and required reviews are the approval
# control change-management evidence rests on, so an agent never weakens or
# steps around them: it may propose a change to them, and a person makes it.
version: 1
rules:
  - id: no-admin-merge
    pattern: '\bgh\s+pr\s+merge\b[^;&|\n]*\s--admin\b'
    verdict: deny
    reason: >-
      Merging with --admin skips the required reviews that approve a change.
      A person who holds that right uses it themselves, with a change record.
  # The branch is the ref a push lands on (after a space, or the ":" of
  # src:dst), whole: a feature branch whose name holds "main" is not main.
  # -f counts inside combined flags (-uf), and git's own options (git -C dir)
  # may come before push.
  - id: no-force-push-to-protected-branch
    pattern: '\bgit\b[^;&|\n]*\spush\b[^;&|\n]*\s(?:-[a-zA-Z]*f[a-zA-Z]*|--force\S*)(?:\s[^;&|\n]*)?[\s:](?:refs/heads/)?(?:main|master|production)(?:[\s;&|)]|$)|\bgit\b[^;&|\n]*\spush\b[^;&|\n]*[\s:](?:refs/heads/)?(?:main|master|production)(?:\s[^;&|\n]*)?\s(?:-[a-zA-Z]*f[a-zA-Z]*|--force\S*)(?:[\s;&|)]|$)|\bgit\b[^;&|\n]*\spush\b[^;&|\n]*\s\+(?:[^\s:;&|]*:)?(?:refs/heads/)?(?:main|master|production)(?:[\s;&|)]|$)'
    verdict: deny
    reason: >-
      A force push to a protected branch rewrites the history that shows who
      approved which change.
  - id: no-branch-protection-change
    pattern: '\bgh\s+api\b[^;&|\n]*/(?:branches/[^\s;&|]+/protection|rulesets)\b[^;&|\n]*\s(?:-X|--method)[=\s]*(?:DELETE|PUT|PATCH|POST)\b|\bgh\s+api\b[^;&|\n]*\s(?:-X|--method)[=\s]*(?:DELETE|PUT|PATCH|POST)\b[^;&|\n]*/(?:branches/[^\s;&|]+/protection|rulesets)\b'
    verdict: deny
    reason: >-
      Branch protection and rulesets decide who must approve a change. An
      agent may propose a change to them; a person makes it.
