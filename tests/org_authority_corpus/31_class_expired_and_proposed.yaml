# nable org model v1
# An expired entry, a proposal and an entry dated ahead hold at approve_each;
# two confirmed bounded entries answer with the narrowest bound.
- fact: authority
  subject: {kind: action_class, id: tag}
  value: {rung: bounded, tag_keys: [team], approvers: ["email:ana@acme.example"], expires: 2026-10-31}
  source: human
  status: confirmed
  confirmed_at: 2026-01-15
- fact: authority
  subject: {kind: action_class, id: ticket}
  value: {rung: bounded, max_per_day: 5, repos: [Acme/Payments, acme/infra], approvers: ["email:ana@acme.example"], expires: 2027-06-30}
  source: a-pull-request
  status: proposed
  proposed_at: 2026-10-01
- fact: authority
  subject: {kind: action_class, id: offhours_schedule}
  value: {rung: bounded, environments: [nonprod, sandbox], approvers: ["email:ana@acme.example", "email:bo@acme.example"], expires: 2027-06-30}
  source: human
  status: confirmed
  confirmed_at: 2026-10-01
- fact: authority
  subject: {kind: action_class, id: offhours_schedule}
  value: {rung: bounded, environments: [NonProd, dr], max_resources_per_call: 4, approvers: ["email:bo@acme.example"], expires: 2027-05-31}
  source: human
  status: confirmed
  confirmed_at: 2026-10-02
- fact: authority
  subject: {kind: action_class, id: offhours_schedule}
  value: {rung: bounded, environments: [nonprod], approvers: ["email:bo@acme.example"], expires: 2027-09-30}
  source: human
  status: rejected
  confirmed_at: 2026-10-03
