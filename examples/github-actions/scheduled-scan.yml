name: nable scheduled scan

# Copy into YOUR repo at .github/workflows/nable-scan.yml (this repo does not
# run it). Every morning it runs `nable scan --json` against an AWS account
# and keeps the JSON as a workflow artifact for 30 days.
#
# Credentials: a read-only IAM role assumed through GitHub's OIDC provider, so
# no key is stored. Set the repository variable NABLE_AWS_ROLE_ARN to it
# (`nable scan --dry-run --json` prints every call a scan makes and the
# least-privilege policy for them). The scan reads the account
# with free APIs only: no Cost Explorer request, no change to anything.
#
# `nable scan` exit codes, and what this job does with them:
#   0  scanned (a partial scan that still found something is 0 too)
#   3  credentials expired          4  permission denied everywhere
#   5  partial, nothing usable      6  no credentials, or AWS rejected them
#   7  the AWS config does not resolve (profile, region)
#   1  anything else (an unexpected error, no network)
# The artifact is uploaded either way: on a failure it holds
# {"error": {"class", "exit_code", "message"}}. Then the job fails with the
# scan's exit code, with an annotation that says which of the above it was.

on:
  schedule:
    - cron: "23 6 * * *"            # daily 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write                   # OIDC, for the read-only role

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FINOPS_NO_KEYRING: "1"
      NABLE_NO_UPDATE_CHECK: "1"
      AWS_REGION: ${{ vars.NABLE_AWS_REGION || 'us-east-1' }}
      SCAN_JSON: ${{ github.workspace }}/nable-scan.json
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install nable
        run: python -m pip install --quiet "finops-mcp==0.13.0"

      - name: Read-only AWS role
        if: ${{ vars.NABLE_AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.NABLE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.NABLE_AWS_REGION || 'us-east-1' }}

      - name: Scan
        id: scan
        run: |
          set +e
          nable scan --json > "$SCAN_JSON"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "nable scan finished" ;;
            6) echo "::error title=nable scan::no usable AWS credentials (exit 6). Set the repository variable NABLE_AWS_ROLE_ARN to a read-only role." ;;
            3) echo "::error title=nable scan::the AWS credentials expired (exit 3)" ;;
            4) echo "::error title=nable scan::permission denied everywhere (exit 4): attach the policy 'nable scan --dry-run --json' prints" ;;
            5) echo "::error title=nable scan::partial scan with nothing usable (exit 5)" ;;
            7) echo "::error title=nable scan::the AWS config does not resolve (exit 7): check AWS_REGION" ;;
            *) echo "::error title=nable scan::nable scan failed (exit $code)" ;;
          esac

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nable-scan-${{ github.run_id }}
          path: ${{ env.SCAN_JSON }}
          retention-days: 30
          if-no-files-found: error

      - name: Fail when the scan did
        if: always() && steps.scan.outputs.exit_code != '0'
        env:
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
        run: exit "${SCAN_EXIT:-1}"
