# nable org model v1
# Confirmed years ahead: not in force before its date, so rds_ri is held at
# recommend. A proposal dated one day after today counts (a laptop ahead of
# UTC), and one dated two days after does not.
- fact: authority
  subject: {kind: action_class, id: rds_ri}
  value: {rung: approve_each, approvers: ["email:ana@acme.example"], expires: 2031-06-30}
  source: human
  status: confirmed
  confirmed_at: 2030-07-01
- fact: authority
  subject: {kind: action_class, id: elasticache_ri}
  value: {rung: approve_each, approvers: ["email:ana@acme.example"], expires: 2027-06-30}
  source: human
  status: proposed
  proposed_at: 2026-11-02
- fact: authority
  subject: {kind: action_class, id: database_savings_plan}
  value: {rung: approve_each, approvers: ["email:ana@acme.example"], expires: 2027-06-30}
  source: human
  status: proposed
  proposed_at: 2026-11-03
