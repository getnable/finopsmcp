# A code pack: a connector and an org-context adapter. nable never imports this
# code; the broker runs it in a subprocess with only what is declared below.
# Code runs only from a pack signed by a key the org trusts, or one the org
# allowlists by id (packs.allow_unsigned_code). Check, sign and run it with:
#   nable pack validate examples/packs/example-csv-connector
#   nable pack sign examples/packs/example-csv-connector --key org-packs.pem
#   nable pack install examples/packs/example-csv-connector
#   EXAMPLE_COSTS_CSV=$PWD/examples/packs/example-csv-connector/samples/costs.csv \
#     nable pack run com.example/example-csv-connector csv-costs --start 2026-09-01 --end 2026-10-01
[pack]
name        = "example-csv-connector"
namespace   = "com.example"
version     = "1.0.0"
description = "Costs from a CSV export as FOCUS rows, and owners from a CSV as proposed org facts"
license     = "Apache-2.0"
nable_api   = ">=1.0,<2.0"
maintainers = ["@getnable"]
support     = "community"
status      = "active"

# No network: on Linux the broker can then run it with no network at all.
[capabilities]
read_data    = ["org.owners"]
secrets      = ["EXAMPLE_COSTS_CSV", "EXAMPLE_OWNERS_CSV"]
write_org    = ["proposals"]
max_autonomy = "L1"

[provides]
connectors = [{id = "csv-costs", entry = "example_csv_connector.costs:fetch", output = "focus-1.3"}]
adapters   = [{id = "csv-owners", entry = "example_csv_connector.owners:propose"}]

[compat]
clouds = ["any"]
